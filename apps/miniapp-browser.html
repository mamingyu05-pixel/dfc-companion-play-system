<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DFC · 手机交互原型</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e9f1fa;background:#0c1422}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;padding:18px 18px 96px}.notice{background:#ffe6a5;color:#3c2c0c;padding:12px;font-size:13px;line-height:1.6;border-radius:12px}.brand{letter-spacing:3px;color:#83e8c3;font-size:13px}h1{font-size:28px;margin:9px 0}h2{font-size:20px}p{line-height:1.65;color:#b4c6da}.card{background:#17253a;border:1px solid #30445f;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.badge{font-size:12px;color:#90eacb}.money{font-size:25px;font-weight:700}button,select,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #49617e;min-height:46px}button{cursor:pointer;background:#84e8c4;color:#092c26;font-weight:700}button.secondary{background:#243853;color:#e9f1fa}button:disabled{opacity:.5;cursor:wait}select,input{background:#101d30;color:#fff;width:100%;margin:8px 0 16px}label{display:block;font-size:14px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:12px;background:#101d30;border-top:1px solid #30445f;justify-content:center}nav button{min-width:95px}button.full{width:100%}#message{white-space:pre-wrap;border-radius:12px;padding:12px;background:#23394e;line-height:1.6}#message:empty{display:none}.muted{font-size:13px;color:#abbdd0}.steps{font-size:14px;line-height:2}.selected{outline:2px solid #84e8c4}dialog{max-width:calc(100% - 28px);width:430px;background:#17253a;color:white;border:1px solid #537093;border-radius:18px;padding:22px}dialog::backdrop{background:#000b}dialog p{color:#e0e9f5}small{line-height:1.6;display:block}.orderid{overflow-wrap:anywhere;font-size:12px;color:#a8c1db}
</style></head><body><main><div class="notice">本机交互原型 · H5 演示<br>未接微信登录／支付，未在开发者工具／真机验收。仅虚构数据，所有付款均为模拟。</div><header><p class="brand">DELTA FORCE CLUB / DEMO</p><h1>一起，打好这一局</h1><p>选择服务、确认费用、查看订单进度。</p></header><div id="message" role="status" aria-live="polite"></div><section id="content"></section></main><nav aria-label="页面导航"><button data-demo-action="tab-service">选服务</button><button class="secondary" data-demo-action="tab-orders">我的订单</button><button class="secondary" data-demo-action="tab-wallet">演示钱包</button></nav><dialog id="confirm"><h2>确认模拟付款</h2><div id="summary"></div><p class="notice">只操作本机演示余额，不发起微信支付或真实扣款。</p><button class="full" data-demo-action="pay">确认模拟余额付款</button><button class="secondary full" style="margin-top:10px" data-demo-action="close-confirm">返回修改</button></dialog><script>
'use strict';
const $=s=>document.querySelector(s);let state=null,tab='service',selected='',mode='',hours=1,busy=false,request=0,paid=false,clientRequestId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'¥'+Number(n||0).toFixed(2);const labels={PAID:'已模拟付款 · 等待派单',PENDING_PAYMENT:'待付款',PENDING:'待处理',DISPATCHING:'派单中',ACCEPTED:'已接单',IN_SERVICE:'服务中',IN_PROGRESS:'服务中',WAITING_ACCEPTANCE:'待验收',PENDING_ACCEPTANCE:'待验收',COMPLETED:'已完成',CANCELLED:'已取消',REFUNDED:'已退款'};
function message(t){$('#message').textContent=t}function customerLinks(id){const box=document.createElement('div');box.className='card';const note=document.createElement('p');note.textContent='以下进入同源真实网页测试端，继续使用隔离演示身份；不是微信小程序页面。';box.append(note);for(const [title,url] of [['订单与验收','/customer/orders/?orderId='],['进入投诉页','/customer/complaints/?orderId=']]){const a=document.createElement('a');a.textContent=title;a.href=url+encodeURIComponent(id);a.style.cssText='display:block;color:#95ebcc;margin:16px 0';a.dataset.demoAction='customer-link';box.append(a)}$('#message').append(box)}function companion(){return state?.companions?.find(c=>c.id===selected)}function modes(c){return c?.modes?.length?c.modes:[]}function modeValue(m){return typeof m==='object'?(m.value||m.id||m.name):m}function render(){if(!state){$('#content').innerHTML='<div class="card"><h2>演示数据尚未加载</h2><p>连接本机隔离服务后可继续。</p><button data-demo-action="refresh">重新加载</button></div>';return}const w=state.wallet||{};if(tab==='service'){$('#content').innerHTML='<h2>01 / 选择陪玩与服务</h2>'+state.companions.map(c=>'<article class="card '+(selected===c.id?'selected':'')+'"><div class="row"><h2>'+esc(c.nickname)+'</h2><span class="badge">虚构演示陪玩</span></div><div class="row"><span>'+money(c.price)+' / 小时</span><button data-demo-action="select" data-id="'+esc(c.id)+'">'+(selected===c.id?'已选择':'选择 TA')+'</button></div></article>').join('')+(companion()?'<div class="card"><label>游戏模式<select data-demo-action="mode">'+modes(companion()).map(m=>'<option '+(modeValue(m)===mode?'selected':'')+' value="'+esc(modeValue(m))+'">'+esc(typeof m==='object'?(m.label||m.name||m.value):m)+'</option>').join('')+'</select></label><label>服务时长<select data-demo-action="hours">'+[1,2,3,4].map(n=>'<option value="'+n+'" '+(hours===n?'selected':'')+'>'+n+' 小时</option>').join('')+'</select></label><div class="row"><span>模拟订单金额</span><span class="money">'+money(Number(companion().price)*hours)+'</span></div><p class="muted">付款后冻结演示余额，等待派单。服务费以服务端确认结果为准。</p><button class="full" data-demo-action="review" '+(busy||!mode?'disabled':'')+'>下一步 · 确认订单</button></div>':'');}
else if(tab==='wallet'){$('#content').innerHTML='<h2>演示钱包</h2><div class="card"><p>可用演示余额</p><div class="money">'+money(w.availableBalance)+'</div><p>已冻结演示余额 '+money(w.frozenBalance)+'</p><small>此数值来自本机隔离数据库，不代表任何真实资金。充值及退款异常请在管理演示章节操作。</small></div><button data-demo-action="refresh">刷新余额</button>';}
else{$('#content').innerHTML='<div class="row"><h2>我的订单</h2><button class="secondary" data-demo-action="refresh">刷新进度</button></div><p class="muted">这里只展示演示身份的订单。接单、服务和结算操作在对应角色章节进行。</p>'+((state.orders||[]).length?state.orders.map(o=>'<article class="card"><span class="badge">'+esc(labels[o.status]||o.status)+'</span><h2>'+esc(o.companion?.nickname||o.companionName||'演示服务订单')+'</h2><p class="orderid">'+esc(o.orderNo||o.id)+'</p><p>'+esc(o.mode||o.gameMode||'服务')+' · '+esc(o.hours||o.durationHours||'—')+' 小时 · '+money(o.totalAmount??o.amount)+'</p><div class="steps">选择服务 → 模拟付款 → 派单／接单<br>加入语音 → 开始／结束 → 验收（评价尚未实现）</div><button class="secondary" data-demo-action="guide" data-id="'+esc(o.id)+'">评价／退款／投诉指引</button></article>').join(''):'<div class="card">还没有演示订单，先选服务吧。</div>');}}
async function refresh(){const seq=++request;message('正在读取本机演示数据…');try{const r=await fetch('/demo-api/state',{cache:'no-store'});if(!r.ok)throw Error('本机接口暂时不可用');const data=await r.json();if(seq!==request)return;state=data.state||data;if(!Array.isArray(state.companions))throw Error('演示数据结构异常');if(!companion()){selected=state.companions[0]?.id||'';mode=modeValue(modes(companion())[0])||''}message('');render()}catch(e){if(seq!==request)return;message('加载失败：'+e.message+'。请重试；已有画面可能不是最新状态。');render()}}
document.addEventListener('change',e=>{if(e.target.dataset.demoAction==='mode'){mode=e.target.value;clientRequestId=null;}if(e.target.dataset.demoAction==='hours'){hours=Number(e.target.value);clientRequestId=null;render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-demo-action]');if(!b)return;const a=b.dataset.demoAction;if(a.startsWith('tab-')){tab=a.slice(4);render();return}if(a==='select'){clientRequestId=null;selected=b.dataset.id;mode=modeValue(modes(companion())[0])||'';render()}if(a==='refresh')await refresh();if(a==='review'){paid=false;clientRequestId ||= crypto.randomUUID();$('#summary').innerHTML='<p>陪玩：'+esc(companion().nickname)+'</p><p>服务：'+esc(mode)+' / '+hours+' 小时</p><h2>'+money(Number(companion().price)*hours)+'</h2><p>可用演示余额：'+money(state.wallet?.availableBalance)+'</p>';$('#confirm').showModal()}if(a==='close-confirm'&&!busy)$('#confirm').close();if(a==='guide')message('订单与验收：进入客户站订单列表。评价功能尚未实现。\n退款：联系客户服务，由客服与管理员人工裁决，按实际责任和资金状态处理；没有客户自助退款申请按钮。\n投诉：提供订单与事实描述，在客户站投诉页提交。投诉发起数不会直接扣分或判责。\n本手机原型此处仅提供引导，未实现上述提交接口。');if(a==='guide')customerLinks(b.dataset.id);if(a==='pay'&&!busy&&!paid){busy=true;b.disabled=true;try{const r=await fetch('/demo-api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create-order',companionId:selected,hours,mode,clientRequestId})});const data=await r.json();if(!r.ok||data.ok===false)throw Error(data.message||data.error||'模拟付款失败');paid=true;clientRequestId=null;$('#confirm').close();tab='orders';await refresh();message('模拟订单已创建。请查看订单和冻结余额，再进入管理端派单。')}catch(err){message('操作未确认成功：'+err.message+'。请先刷新订单，核实是否已成单，勿反复付款。');$('#confirm').close()}finally{busy=false;b.disabled=false;render()}}});refresh();
</script></body></html>
