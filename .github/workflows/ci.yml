name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dfc_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: dfc_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfc_test -d dfc_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dfc_test:synthetic_ci_only@127.0.0.1:5432/dfc_synthetic
      DFC_TEST_MODE: "1"
      JWT_SECRET: synthetic-ci-signing-only
      DFC_BACKGROUND_JOBS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dfc/database prisma:generate
      - run: pnpm --filter @dfc/database prisma:deploy
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @dfc/api-server test
      - run: pnpm test:business
